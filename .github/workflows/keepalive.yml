name: supabase-keepalive

# Не даёт free-tier Supabase уснуть (авто-пауза после ~7 дней простоя).
# ВАЖНО: раз в СУТКИ, а не раз в неделю. Окно паузы — 7 дней, а расписание
# GitHub Actions может задержаться/пропустить один запуск под нагрузкой, поэтому
# пинговать надо заметно чаще окна. Суточный пинг даёт большой запас прочности.

on:
  schedule:
    - cron: '17 6 * * *'   # каждый день в 06:17 UTC. Реже раза в сутки — рискованно.
  workflow_dispatch: {}      # ручной запуск (для проверки)

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Poke Supabase (keep the project awake)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Секреты SUPABASE_URL / SUPABASE_ANON_KEY не заданы в настройках репозитория."
            exit 1
          fi
          # Реальный SELECT через PostgREST = запрос к Postgres = «активность» для Supabase.
          # Таблица questions существует в схеме; даже пустой ответ под RLS считается активностью.
          code=$(curl -sS -m 30 -o /tmp/keepalive.out -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/questions?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP ${code}"
          head -c 300 /tmp/keepalive.out || true
          echo
          case "${code}" in
            2*) echo "✅ Supabase awake (HTTP ${code})" ;;
            *)  echo "::error::keep-alive не прошёл (HTTP ${code}) — проверь URL/ключ и не на паузе ли проект."; exit 1 ;;
          esac
