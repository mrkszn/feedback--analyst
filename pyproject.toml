[project]
name = "telegram-waiter"
version = "0.1.0"
description = "Telegram feedback-collector + adaptive interview bot with admin counterpart"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.28.2",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-openai>=1.2.2",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.1",
    "openai>=2.38.0",
    "pinecone>=7.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "structlog>=25.5.0",
    "supabase>=2.30.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "qrcode[pil]>=8.2",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# RUF001/2/3 — ambiguous unicode (кириллица рядом с латиницей):
# у нас весь проект на русском, в docstrings и UI-строках это норма.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах допустимы синхронные pathlib-вызовы внутри async-фикстур —
# короткие, локальные, не блокируют event loop в значимой мере.
"tests/**" = ["ASYNC240"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
