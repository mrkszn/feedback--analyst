<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>List rows</title>
<style>
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.row { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; }
.avatar { width: 36px; height: 36px; border-radius: 999px; background: var(--violet-100); color: #5b21b6; display: flex; align-items: center; justify-content: center; font: 600 13px/16px var(--font-sans); flex-shrink: 0; }
.body { flex: 1; min-width: 0; }
.body .top { display: flex; gap: 8px; align-items: baseline; }
.body .name { font: 600 14px/18px var(--font-sans); color: var(--text-1); }
.body .id   { font: 500 12px/16px var(--font-mono); color: var(--text-3); }
.body .preview { font: 400 13px/18px var(--font-sans); color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.time { font: 500 12px/14px var(--font-mono); color: var(--text-3); }
.dot { width: 6px; height: 6px; border-radius: 999px; }
.s-pos { background: #10b981; }
.s-neg { background: #f43f5e; }
.s-neu { background: #94a3b8; }
</style></head>
<body>
<div class="list">
  <div class="row">
    <div class="avatar">МК</div>
    <div class="body">
      <div class="top"><span class="name">Maria K.</span><span class="id">#1287</span></div>
      <div class="preview">Очень быстрая доставка, всё пришло аккуратно. Спасибо!</div>
    </div>
    <div class="right"><span class="time">3 min</span><span class="dot s-pos"></span></div>
  </div>
  <div class="row">
    <div class="avatar" style="background:#fff1f2;color:#be123c">АТ</div>
    <div class="body">
      <div class="top"><span class="name">Anton T.</span><span class="id">#1286</span></div>
      <div class="preview">Курьер опоздал на 40 минут, заказ остыл — пришлось разогревать.</div>
    </div>
    <div class="right"><span class="time">12 min</span><span class="dot s-neg"></span></div>
  </div>
  <div class="row">
    <div class="avatar" style="background:var(--slate-100);color:var(--text-2)">ЛС</div>
    <div class="body">
      <div class="top"><span class="name">Lena S.</span><span class="id">#1285</span></div>
      <div class="preview">Заказ оформлен, пока без обратной связи.</div>
    </div>
    <div class="right"><span class="time">31 min</span><span class="dot s-neu"></span></div>
  </div>
</div>
</body></html>
