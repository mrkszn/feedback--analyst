<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Type — display + heads</title>

.row .meta { font: 500 11px/14px var(--font-mono); color: var(--text-3); width: 140px; flex-shrink: 0; }
.row .specimen { color: var(--text-1); }
</style></head>
<body>
<div class="row"><span class="meta">display · 28 / 600</span><span class="specimen display">Voice analytics</span></div>
<div class="row"><span class="meta">h1 · 22 / 600</span><span class="specimen h1">Recent feedback</span></div>
<div class="row"><span class="meta">h2 · 18 / 600</span><span class="specimen h2">Top topics this week</span></div>
<div class="row"><span class="meta">h3 · 16 / 600</span><span class="specimen h3">Service quality · 42 mentions</span></div>
</body></html>
