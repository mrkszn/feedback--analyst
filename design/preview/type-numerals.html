<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Type — numerals</title>
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.kpi { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.kpi .label { font: 500 12px/16px var(--font-sans); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }
.kpi .num   { font: 600 28px/32px var(--font-mono); color: var(--text-1); letter-spacing: -0.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .delta { font: 500 12px/16px var(--font-mono); margin-top: 4px; }
.up { color: #059669; }
.down { color: #e11d48; }
.flat { color: #b45309; }
</style></head>
<body>
<div class="grid">
  <div class="kpi"><div class="label">Feedback</div><div class="num">1 248</div><div class="delta up">+18.4%</div></div>
  <div class="kpi"><div class="label">Sentiment</div><div class="num">0.78</div><div class="delta up">+0.04</div></div>
  <div class="kpi"><div class="label">Sessions</div><div class="num">3 091</div><div class="delta flat">±0.0%</div></div>
</div>
</body></html>
