<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Bottom nav</title>
<style>
body { background: var(--slate-100); padding: 24px; }
.frame { width: 375px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 28px 0 0; overflow: hidden; box-shadow: 0 24px 48px -12px rgba(15,23,42,0.18); }
.fake-content { height: 80px; padding: 0 16px; font: 600 14px/20px var(--font-sans); color: var(--text-3); display:flex; align-items:flex-end; padding-bottom: 12px; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: rgba(255,255,255,0.85); backdrop-filter: blur(12px); border-top: 1px solid var(--border); box-shadow: 0 -4px 12px rgba(15,23,42,0.06); }
.nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 0 12px; color: var(--text-3); font: 500 11px/14px var(--font-sans); cursor: pointer; }
.nav-item.active { color: var(--violet-600); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item.active svg { stroke-width: 2.25; }
.fab { position: relative; }
.fab .b { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; border-radius: 999px; background: var(--violet-600); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 16px -4px rgba(124,58,237,0.5); }
.fab .b svg { width: 22px; height: 22px; }
</style></head>
<body>
<div class="frame">
  <div class="fake-content">Page content scrolls behind the nav…</div>
  <div class="nav">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Overview
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      Metrics
    </div>
    <div class="nav-item fab"><div class="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></div></div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Clients
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Ask
    </div>
  </div>
</div>
</body></html>
