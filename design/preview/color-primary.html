<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Primary — Admin</title>
<style>
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.swatch { aspect-ratio: 1 / 1.2; display: flex; align-items: flex-end; padding: 6px; }
.swatch span { font: 500 10px/12px var(--font-mono); color: rgba(255,255,255,0.9); }
.swatch.dark span { color: rgba(0,0,0,0.6); }
.role { display: flex; gap: 10px; margin-top: 14px; }
.role-chip { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.role-chip .name { font: 600 12px/16px var(--font-sans); color: var(--text-1); }
.role-chip .hint { font: 400 11px/14px var(--font-mono); color: var(--text-3); margin-top: 2px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }
</style></head>
<body>
<div class="scale">
  <div class="swatch dark" style="background:#f5f3ff"><span>50</span></div>
  <div class="swatch dark" style="background:#ede9fe"><span>100</span></div>
  <div class="swatch dark" style="background:#ddd6fe"><span>200</span></div>
  <div class="swatch dark" style="background:#c4b5fd"><span>300</span></div>
  <div class="swatch" style="background:#a78bfa"><span>400</span></div>
  <div class="swatch" style="background:#8b5cf6"><span>500</span></div>
  <div class="swatch" style="background:#7c3aed"><span>600</span></div>
  <div class="swatch" style="background:#6d28d9"><span>700</span></div>
  <div class="swatch" style="background:#5b21b6"><span>800</span></div>
  <div class="swatch" style="background:#4c1d95"><span>900</span></div>
</div>
<div class="role">
  <div class="role-chip"><div class="name"><span class="dot" style="background:#7c3aed"></span>--primary</div><div class="hint">violet-600</div></div>
  <div class="role-chip"><div class="name"><span class="dot" style="background:#6d28d9"></span>--primary-hover</div><div class="hint">violet-700</div></div>
  <div class="role-chip"><div class="name"><span class="dot" style="background:#ede9fe"></span>--primary-soft</div><div class="hint">violet-100</div></div>
</div>
</body></html>
