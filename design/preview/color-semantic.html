<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Semantic</title>
<style>
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
.cell { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.cell .top { height: 64px; display: flex; align-items: center; justify-content: center; }
.cell .top svg { width: 22px; height: 22px; }
.cell .bot { padding: 8px 10px; background: var(--surface); }
.cell .name { font: 600 12px/16px var(--font-sans); color: var(--text-1); }
.cell .hint { font: 400 11px/14px var(--font-mono); color: var(--text-3); }
.cell .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.05); }
.dot.soft { width: 12px; height: 12px; border-radius: 3px; }
</style></head>
<body>
<div class="grid">
  <div class="cell">
    <div class="top" style="background:#059669"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
    <div class="bot"><div class="name">Success</div><div class="hint">emerald-600 · #059669</div><div class="row"><div class="dot soft" style="background:#ecfdf5;border:1px solid #d1fae5"></div><span class="hint">--success-soft</span></div></div>
  </div>
  <div class="cell">
    <div class="top" style="background:#f59e0b"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="m4.93 19.07 14.14-14.14"/><circle cx="12" cy="12" r="10"/></svg></div>
    <div class="bot"><div class="name">Warning</div><div class="hint">amber-500 · #f59e0b</div><div class="row"><div class="dot soft" style="background:#fffbeb;border:1px solid #fef3c7"></div><span class="hint">--warning-soft</span></div></div>
  </div>
  <div class="cell">
    <div class="top" style="background:#e11d48"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <div class="bot"><div class="name">Danger</div><div class="hint">rose-600 · #e11d48</div><div class="row"><div class="dot soft" style="background:#fff1f2;border:1px solid #ffe4e6"></div><span class="hint">--danger-soft</span></div></div>
  </div>
  <div class="cell">
    <div class="top" style="background:#0ea5e9"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div>
    <div class="bot"><div class="name">Info</div><div class="hint">sky-500 · #0ea5e9</div><div class="row"><div class="dot soft" style="background:#f0f9ff;border:1px solid #e0f2fe"></div><span class="hint">--info-soft</span></div></div>
  </div>
</div>
</body></html>
