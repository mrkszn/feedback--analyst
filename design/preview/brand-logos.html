<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Brand</title>
<style>
.brand-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.brand-card { display: flex; align-items: center; gap: 14px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.brand-card img { width: 48px; height: 48px; }
.brand-card .name { font: 600 14px/18px var(--font-sans); color: var(--text-1); }
.brand-card .hint { font: 400 12px/16px var(--font-sans); color: var(--text-3); margin-top: 2px; }
</style></head>
<body>
<div class="brand-wrap">
  <div class="brand-card">
    <img src="../assets/voice-admin.svg" alt="">
    <div>
      <div class="name">Voice / Admin</div>
      <div class="hint">Mini App · violet 500 → 800</div>
    </div>
  </div>
  <div class="brand-card">
    <img src="../assets/voice-receiver.svg" alt="">
    <div>
      <div class="name">Voice / Receiver</div>
      <div class="hint">Bot · indigo 500 → 700</div>
    </div>
  </div>
</div>
</body></html>
