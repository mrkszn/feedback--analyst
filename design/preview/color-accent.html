<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Accent</title>
<style>
.amber { display: flex; gap: 12px; align-items: stretch; }
.swatch { flex: 1; padding: 18px 16px; border-radius: 12px; color: white; }
.swatch .name { font: 600 14px/18px var(--font-sans); }
.swatch .hex  { font: 500 12px/16px var(--font-mono); opacity: 0.85; margin-top: 2px; }
.usage { margin-top: 14px; display: flex; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 500 12px/16px var(--font-sans); background:#fffbeb; color:#b45309; border: 1px solid #fde68a; }
.chip .dot { width: 6px; height: 6px; border-radius: 999px; background: #f59e0b; }
.usage-label { font: 500 12px/16px var(--font-sans); color: var(--text-3); align-self: center; }
</style></head>
<body>
<div class="amber">
  <div class="swatch" style="background:#fef3c7;color:#92400e"><div class="name">amber-100</div><div class="hex" style="opacity:.7">--accent-soft · #fef3c7</div></div>
  <div class="swatch" style="background:#fcd34d;color:#78350f"><div class="name">amber-300</div><div class="hex" style="opacity:.7">#fcd34d</div></div>
  <div class="swatch" style="background:#f59e0b"><div class="name">amber-500</div><div class="hex">--accent · #f59e0b</div></div>
  <div class="swatch" style="background:#b45309"><div class="name">amber-700</div><div class="hex">#b45309</div></div>
</div>
<div class="usage">
  <span class="usage-label">Use for —</span>
  <span class="chip"><span class="dot"></span>Needs attention</span>
  <span class="chip"><span class="dot"></span>Flat delta</span>
  <span class="chip"><span class="dot"></span>Agent thinking</span>
</div>
</body></html>
