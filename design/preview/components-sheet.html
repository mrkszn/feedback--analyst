<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><title>Sheet</title>
<style>
body { background: var(--slate-100); padding: 20px; }
.frame { width: 375px; height: 360px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 24px 48px -12px rgba(15,23,42,0.18); }
.scrim { position: absolute; inset: 0; background: rgba(15,23,42,0.5); }
.sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px 16px 16px; }
.grabber { width: 36px; height: 4px; background: var(--slate-300); border-radius: 999px; margin: 6px auto 14px; }
.sheet h2 { font: 600 18px/24px var(--font-sans); color: var(--text-1); margin: 0 0 4px; letter-spacing: -0.005em; }
.sheet p  { font: 400 14px/20px var(--font-sans); color: var(--text-2); margin: 0 0 16px; }
.sheet .row { display: flex; gap: 8px; }
.btn { flex: 1; height: 40px; display:flex; align-items:center; justify-content:center; border-radius: 8px; font: 500 14px/20px var(--font-sans); cursor: pointer; border: 1px solid transparent; }
.btn.p { background: var(--violet-600); color: white; }
.btn.s { background: var(--surface); color: var(--text-1); border-color: var(--border); }
.fake { padding: 20px; color: var(--text-3); font: 600 14px/20px var(--font-sans); }
</style></head>
<body>
<div class="frame">
  <div class="fake">Page below…</div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>Delete this client?</h2>
    <p>Their feedback history will remain anonymized. This cannot be undone.</p>
    <div class="row"><button class="btn s">Cancel</button><button class="btn p" style="background:#e11d48">Delete</button></div>
  </div>
</div>
</body></html>
